name: Windows bootstrap tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile launcher and environment helper
        run: python -m py_compile YishengTranslator_memory_limit.pyw yisheng_startup.py
      - name: Offline regression tests
        run: python -m unittest discover -s tests -p test_*.py -v
